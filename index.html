;\n  var evs=await evRange(s,lim);if(!evs.length)break;\n  for(var i=0;i<evs.length;i++){var d=evs[i].data,sym=coin2sym[d.coin_name];if(!sym)continue;\n   if((await txInfo(Number(evs[i].version))).settle)continue;   // the settlement account never enters user figures\n   var amt=Number(BigInt(d.amount))/Math.pow(10,C.SYM[sym][1]);\n   w[sym]=w[sym]||{rp:0,wd:0};if(d.oper_type==='Repay'){w[sym].rp+=amt;n++;}else if(d.oper_type==='Withdraw'){w[sym].wd+=amt;n++;}}\n  s+=evs.length;}\n win=w;win24Count=n;}\nasync function refresh(){\n err=null;\n try{var led=await N(CUR,'/');ledgerNow=Number(led.ledger_version);\n  var h=await N(CUR,'/accounts/'+C.POOL+'/resource/'+encodeURIComponent(C.LEND+'::pool::LendEventHandle'));\n  counterNow=Number(h.data.oper_events.counter);\n  while(applied<counterNow){var lim=Math.min(100,counterNow-applied);\n   var evs=await evRange(applied,lim,true);\n   if(!evs.length){\n    // not served: either pruned history (a real, permanent gap) or a lagging node that hasn't indexed a new event yet (retry)\n    var pc=Math.min(await prunableBelow(),counterNow);\n    if(applied>=pc)throw new Error('new events not yet visible on the node');\n    var f=await firstServed(applied,pc-1);if(f===applied)throw new Error('event read inconsistent');\n    gap+=f-applied;applied=f;continue;}\n   if(Number(evs[0].sequence_number)!==applied)throw new Error('event sequence mismatch');\n   for(var i=0;i<evs.length;i++){var v=Number(evs[i].version);\n    var st=(await txInfo(v)).settle;          // may throw \u2014 nothing has been applied for this event yet\n    if(st)settleOps++;else{applyEv(evs[i].data);ops++;lastV=v;}\n    applied++;}                               // advance per event, so a retry can never apply one twice\n  }\n }catch(e){err=String(e.message||e).slice(0,140);}\n try{repaid=await readRepaid();repaidErr=null;}catch(e){repaidErr=String(e.message||e).slice(0,100);}\n try{await readHoldings();}catch(e){if(!err)err='vault read failed';}\n try{await compute24h();}catch(e){if(!err)err='24h window read failed';}\n updatedAt=Date.now();render();\n}\nvar prev={};\nfunction ago(){var a=Math.max(0,Math.round((Date.now()-updatedAt)/1000));return a<60?(a+'s'):(a<3600?(Math.round(a/60)+'m'):(Math.round(a/3600)+'h'));}\nfunction render(){\n document.getElementById('pin').textContent=C.PIN;\n document.getElementById('node').textContent=NR?'Nodes: Nodereal (paid) + public':'Nodes: public';\n document.getElementById('lnow').textContent=ledgerNow?ledgerNow.toLocaleString():'\u2014';\n var uo=C.FOLDED+ops;\n // unreadable operations can't be split into user / settlement ones, so the user count becomes a lower bound\n document.getElementById('ops').textContent=gap>0?('\u2265'+uo.toLocaleString()+' (+'+gap+' unreadable)'):uo.toLocaleString();\n var bad=err||gap>0;\n document.getElementById('live').textContent=err?'Chain read error':(gap>0?'Partial \u2014 history pruned':'Live syncing');\n document.getElementById('live').style.color=bad?'var(--red)':'';\n document.getElementById('dot').style.background=bad?'var(--red)':'';\n document.getElementById('upd').textContent=updatedAt?('Updated '+ago()+' ago \u00b7 refreshes every 24h'):'Loading\u2026 \u00b7 refreshes every 24h';\n var so=C.FOLDED_SETTLE+settleOps;\n document.getElementById('lastop').innerHTML=(gap>0?'<span style=\"color:var(--mut)\">Latest user operation unknown (history pruned)<\/span>':(uo>0?('Latest user operation <code>v'+lastV.toLocaleString()+'<\/code>'):'<span style=\"color:var(--mut)\">No user operations since snapshot<\/span>'))+(so>0?(' <span style=\"color:var(--mut)\">\u00b7 '+so+' settlement-account operation'+(so>1?'s':'')+' excluded<\/span>'):'');\n var msgs=[];\n if(err)msgs.push('\u26a0 Chain read error: '+err+' (auto-retrying in 1 min)');\n if(gap>0)msgs.push('\u26a0 '+gap+' operation'+(gap>1?'s':'')+' since the calibration anchor are no longer served by any node (history pruned) and are NOT reflected in the supplied / borrowed figures. Re-run fetch_post_snapshot_ops.py and rebuild to re-anchor.');\n if(unknown>0)msgs.push('\u26a0 Detected '+unknown+' liquidation/unknown events \u2014 recommend full re-calibration.');\n if(repaidErr)msgs.push('\u26a0 Could not read the settlement account position ('+repaidErr+') \u2014 repaid figure shows '+(repaid?'the last successful live read':'the snapshot value')+' (auto-retrying in 1 min).');\n var w=document.getElementById('warn');\n if(msgs.length){w.style.display='';w.innerHTML=msgs.map(function(m){return '<span class=\"warn\">'+m+'<\/span>';}).join('<br>');}else w.style.display='none';\n var rpU=repaid?repaid.usd:snapRepaidU;\n document.getElementById('rpU').textContent=fU(rpU);\n document.getElementById('rpS').textContent=(repaid?(repaidErr?'Last live read':'Live on-chain position'):'Snapshot value')+' \u00b7 '+(C.TOTBAD?(100*rpU/C.TOTBAD).toFixed(1):'0')+'% of bad debt';\n document.getElementById('remU').textContent=fU(Math.max(0,C.TOTBAD-rpU));\n document.getElementById('remS').textContent='of '+fU(C.TOTBAD)+' total bad debt at snapshot';\n var html='',tsup=0,tbor=0,thold=0,t24rp=0,t24wd=0;\n for(var i=0;i<C.ORDER.length;i++){var sym=C.ORDER[i],c=coins[sym];if(!c)continue;\n  var su=c.supply*c.price,bu=c.borrow*c.price,hu=c.holding*c.price;tsup+=su;tbor+=bu;thold+=hu;\n  var wv=win[sym]||{rp:0,wd:0};var rpUsd=wv.rp*c.price,wdUsd=wv.wd*c.price;t24rp+=rpUsd;t24wd+=wdUsd;\n  var chg=prev[sym]&&(prev[sym].s!==c.supply||prev[sym].b!==c.borrow||prev[sym].h!==c.holding);\n  html+='<tr class=\"'+(chg?'flash':'')+'\"><td class=\"asset\">'+sym+'<div class=\"sub2\">'+(SYMNAME[sym]||'')+'<\/div><\/td>'+\n   '<td><div class=\"big sup\">'+fT(c.supply,sym)+'<\/div><div class=\"sub2\">'+fU(su)+'<\/div><\/td>'+\n   '<td><div class=\"big bor\">'+fT(c.borrow,sym)+'<\/div><div class=\"sub2\">'+fU(bu)+'<\/div><\/td>'+\n   '<td><div class=\"big hold\">'+fT(c.holding,sym)+'<\/div><div class=\"sub2\">'+fU(hu)+'<\/div><\/td>'+\n   '<td>'+(wv.rp>0?('<div class=\"big sup\">+'+fT(wv.rp,sym)+'<\/ async function nrDecrypt(pw){if(!NRC)return null;try{
 var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 var salt=new Uint8Array(NRC.salt.match(/../g).map(function(h){return parseInt(h,16)}));

 var ks=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:NRC.iter,hash:'SHA-256'},key,ct.length*8));
 var s='';for(var i=0;i<ct.length;i++)s+=String.fromCharCode(ct[i]^ks[i]);
 return /^https:\/\/[^\s"'<>]+$/.test(s)?s:null;}catch(e){return null;}}
